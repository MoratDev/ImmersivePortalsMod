---
configs:
  - comment: For vanilla terrain rendering
    type: vs
    # since 1.21.2 the terrain render types (solid, cutout, cutout_mipped, translucent, tripwire) share one shader source
    affectedShaders:
      - minecraft:core/terrain
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          void main() {
              gl_ClipDistance[0] = dot(Position.xyz + ModelOffset, iportal_ClippingEquation.xyz) +
                  iportal_ClippingEquation.w;
    debugOutput: false
  - comment: For portal area rendering and entity rendering and particle
    type: vs
    # since 1.21.2 most entity render types share one shader source
    affectedShaders:
      - minecraft:core/entity
      - minecraft:core/rendertype_item_entity_translucent_cull
      - immersive_portals:core/portal_area
      - minecraft:core/particle
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          void main() {
              gl_ClipDistance[0] = dot(Position.xyz, iportal_ClippingEquation.xyz) + 
                  iportal_ClippingEquation.w;
    debugOutput: false
  - comment: For iris+sodium
    type: vs
    affectedShaders:
      - iris_gbuffers_terrain
      - iris_gbuffers_water
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement: |-
          uniform vec4 iportal_ClippingEquation;
          void main() {
      - pattern: "\\}(?![\\S\\s]*\\})"
        # match the last } ([\S\s] matches any character). use the modelview-transformed coordinate
        replacement: |-
          gl_ClipDistance[0] = dot(
              (iris_ModelViewMatrix * getVertexPosition()).xyz, iportal_ClippingEquation.xyz
          ) + iportal_ClippingEquation.w;
          }
    debugOutput: false
  - comment: For sodium
    type: vs
    affectedShaders:
      - sodium:blocks/block_layer_opaque.vsh
    transformations:
      - pattern: |-
          void ( )*main( )*\(( )*( )*\)( )*(
          )*\{
        replacement:
          uniform vec4 iportal_ClippingEquation;
          void main() {
      - pattern: "\\}(?![\\S\\s]*\\})"
        # match the last } ([\S\s] matches any character). use the modelview-transformed coordinate
        replacement: |-
          gl_ClipDistance[0] = dot(
              (u_ModelViewMatrix * vec4(position, 1.0)).xyz, iportal_ClippingEquation.xyz
          ) + iportal_ClippingEquation.w;
          }
    debugOutput: false
